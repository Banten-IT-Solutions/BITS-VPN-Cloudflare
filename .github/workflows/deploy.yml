name: '🚀 Deploy'

on:
  # Manual trigger — deploy directly via workflow_dispatch.
  # Pushes to main do NOT auto-deploy; trigger Run workflow from the Actions tab.
  # No environment values are committed to the repo.
  workflow_dispatch:

# All config injected from GitHub Vars/Secrets
# (Settings → Secrets and variables → Actions). Non-sensitive values use
# GitHub Variables; sensitive values (API token, SUB_TOKEN) use GitHub Secrets.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  NODE_NO_WARNINGS: 1
  WORKER_NAME: ${{ vars.WORKER_NAME || secrets.WORKER_NAME }}
  PRX_BANK_URL: ${{ vars.PRX_BANK_URL || secrets.PRX_BANK_URL }}
  KV_PRX_URL: ${{ vars.KV_PRX_URL || secrets.KV_PRX_URL }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN || secrets.APP_DOMAIN }}
  WC_DOMAIN: ${{ vars.WC_DOMAIN || secrets.WC_DOMAIN }}
  APP_URL: ${{ vars.APP_URL || secrets.APP_URL || format('https://{0}', vars.APP_DOMAIN || secrets.APP_DOMAIN) }}
  SUB_TOKEN: ${{ secrets.SUB_TOKEN }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: '☁️ Deploy to Cloudflare'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7.0.1

      - name: '🟣 Setup Bun'
        uses: oven-sh/setup-bun@v2.2.0

      - name: '📦 Install dependencies'
        run: bun install --frozen-lockfile

      - name: '🔍 Typecheck'
        run: bun run types

      - name: '🔧 Generate wrangler.jsonc'
        run: bun run cf:config

      - name: '🚀 Deploy Worker'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # config is in the generated wrangler.jsonc — no extra args needed

      - name: '🔐 Sync Secrets'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const secrets = {};
            for (const k of ["SUB_TOKEN"]) {
              if (process.env[k]) secrets[k] = process.env[k];
            }
            if (Object.keys(secrets).length) {
              fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
              console.log("Secrets to put:", Object.keys(secrets).join(", "));
            } else {
              console.log("No secrets to put");
            }
          '
          if [ -f .worker-secrets.json ]; then
            head -c 200 .worker-secrets.json; echo
            npx wrangler secret bulk .worker-secrets.json --config wrangler.jsonc
            rm -f .worker-secrets.json
          fi
